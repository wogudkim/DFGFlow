[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfgflow"
version = "0.1.0"
description = "DFGFlow time-series preprocessing, training and generation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "tqdm>=4.66", "matplotlib>=3.7"]

[project.optional-dependencies]
preprocessing = ["pandas>=2.2,<3"]

[project.scripts]
dfgflow-train = "dfgflow.train:train"
dfgflow-generate = "dfgflow.generate:main"

[tool.setuptools.packages.find]
where = ["src"]
